name: Opt-in OSV dependency scan

on:
  workflow_call:
    inputs:
      publish_summary:
        description: Publish count-only summary for this public repository
        required: false
        type: boolean
        default: false
      tools_ref:
        description: ThreatScope commit or branch containing the summary helper
        required: false
        type: string
        default: main
    outputs:
      packagesScanned:
        description: Dependency entries scanned
        value: ${{ jobs.scan.outputs.packagesScanned }}
      affectedPackages:
        description: Dependency entries with vulnerability matches
        value: ${{ jobs.scan.outputs.affectedPackages }}
      vulnerabilityMatches:
        description: Total vulnerability matches
        value: ${{ jobs.scan.outputs.vulnerabilityMatches }}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      packagesScanned: ${{ steps.summary.outputs.packagesScanned }}
      affectedPackages: ${{ steps.summary.outputs.affectedPackages }}
      vulnerabilityMatches: ${{ steps.summary.outputs.vulnerabilityMatches }}
    steps:
      - name: Reject public summary for private repositories
        if: inputs.publish_summary && github.event.repository.private
        run: |
          echo "Public summaries are only supported for public repositories." >&2
          exit 1

      - name: Reject publishing pull request results
        if: inputs.publish_summary && github.event_name == 'pull_request'
        run: |
          echo "Run the opt-in scan on a trusted branch, not a pull request." >&2
          exit 1

      - name: Check out repository to scan
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out summary helper
        uses: actions/checkout@v4
        with:
          repository: Arv1121/Threat-Model
          ref: ${{ inputs.tools_ref }}
          path: threatscope-tools

      - name: Install verified OSV-Scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/osv-scanner"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64 \
            --output "$scanner"
          printf '%s  %s\n' \
            'fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8' \
            "$scanner" | sha256sum --check --status
          chmod 0755 "$scanner"

      - name: Scan dependency manifests
        id: summary
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/osv-report.json"
          stderr_file="$RUNNER_TEMP/osv-scanner.stderr"
          summary="$GITHUB_WORKSPACE/source/.github/threatscope/summary.json"

          if "$RUNNER_TEMP/osv-scanner" scan source --recursive --all-packages --format json \
            >"$report" 2>"$stderr_file"; then
            scan_status=0
          else
            scan_status=$?
          fi

          if [ "$scan_status" -eq 128 ]; then
            echo "No supported dependency sources were found; no summary was published." >&2
            exit "$scan_status"
          fi

          if [ "$scan_status" -gt 1 ]; then
            echo "OSV-Scanner failed; details were withheld from workflow logs." >&2
            exit "$scan_status"
          fi

          node "$GITHUB_WORKSPACE/threatscope-tools/scripts/create-scan-summary.mjs" \
            "$report" "$summary"

      - name: Retain private repository findings briefly
        if: github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: osv-dependency-report
          path: ${{ runner.temp }}/osv-report.json
          if-no-files-found: error
          retention-days: 1

  publish-summary:
    if: inputs.publish_summary && !github.event.repository.private && github.event_name != 'pull_request'
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out opted-in repository
        uses: actions/checkout@v4

      - name: Publish count-only summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/threatscope/summary.json
          if git diff --cached --quiet; then
            echo "Count-only summary is unchanged."
            exit 0
          fi
          git commit -m "Update opt-in dependency scan summary"
          git push
