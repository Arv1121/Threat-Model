name: Aggregate opt-in repository summaries

on:
  schedule:
    - cron: '37 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/opt-in-repositories.json

permissions:
  contents: read

concurrency:
  group: aggregate-opt-in-repositories
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out ThreatScope
        uses: actions/checkout@v4

      - name: Generate privacy-preserving aggregate
        run: node scripts/aggregate-repo-summaries.mjs

      - name: Publish changed aggregate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/repository-risk-summary.json
          if git diff --cached --quiet; then
            echo "Community aggregate is unchanged."
            exit 0
          fi
          git commit -m "Refresh opt-in repository aggregate"
          git push
